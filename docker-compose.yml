services:
  soul-chat:
    build: .
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - AIYIWEI_API_KEY=${AIYIWEI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # 部署后改成你的域名，例如 https://chat.example.com
      - SITE_URL=${SITE_URL:-http://localhost}
    restart: unless-stopped
